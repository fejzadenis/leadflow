<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0b0f14;color:#e6edf3;display:flex;align-items:center;padding:0 72px;position:relative}
  .glow{position:absolute;right:-140px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(79,140,255,.30),rgba(79,140,255,0) 68%)}
  .glow2{position:absolute;left:-120px;bottom:-220px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(46,160,67,.20),rgba(46,160,67,0) 70%)}
  .inner{position:relative;width:100%}
  .badge{display:inline-block;font-size:19px;letter-spacing:2.4px;text-transform:uppercase;color:#b9d0ff;border:1.5px solid rgba(79,140,255,.50);background:rgba(79,140,255,.13);border-radius:999px;padding:9px 20px}
  h1{font-size:92px;line-height:1;letter-spacing:-3px;margin-top:26px;font-weight:700}
  h1 span{color:#4f8cff}
  .sub{font-size:31px;line-height:1.32;color:#c3ceda;margin-top:22px;max-width:940px;letter-spacing:-.3px}
  .row{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
  .pill{font-size:20px;color:#dbe6f2;border:1.5px solid #22303c;background:#131a22;border-radius:10px;padding:11px 18px}
  .pill b{color:#fff;font-weight:600}
  .price{color:#2ea043;font-weight:700}
  .foot{position:absolute;left:72px;bottom:38px;font-size:19px;color:#7d8b9c;letter-spacing:.2px}
</style></head>
<body>
<div class="glow"></div><div class="glow2"></div>
<div class="inner">
  <span class="badge">n8n &middot; no scraping &middot; no paid APIs</span>
  <h1>Lead<span>Flow</span></h1>
  <p class="sub">A lead list in. A ready-to-send pipeline out.</p>
  <div class="row">
    <span class="pill"><b>4</b> importable workflows</span>
    <span class="pill">live demo, <b>no install</b></span>
    <span class="pill">Google Sheets log</span>
    <span class="pill"><span class="price">$49</span> launch</span>
  </div>
</div>
<p class="foot">fejzadenis.github.io/leadflow</p>
</body></html>
